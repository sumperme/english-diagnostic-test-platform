name = "eng-diagnostic"
main = "src/index.ts"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "edt-diagnostic"
database_id = "4c4685d5-4e7d-415f-8c50-61894219deb4"
migrations_dir = "../migrations"

# Required by /api/assets/audio/* streaming and /api/reports/:id/pdf rendering.
# In `wrangler dev --local` this is simulated under worker/.wrangler/state;
# seed it via scripts/upload-assets.ps1 -Local -Config worker/wrangler.toml
# (local-preview.ps1 does this automatically).
[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "edt-assets"

[vars]
ALLOWED_ORIGIN = "https://eng-diagnostic.tzy667.workers.dev"
SESSION_TTL_SECONDS = "7200"
ADMIN_PASSWORD = "EDT-Aa2026!"

# Paper III grading queue (AssemblyAI webhook / submit wake the consumer).
[[queues.producers]]
binding = "PAPER3_GRADE"
queue = "edt-paper3-grade"

[[queues.consumers]]
queue = "edt-paper3-grade"
max_batch_size = 1
max_retries = 20
max_concurrency = 2
