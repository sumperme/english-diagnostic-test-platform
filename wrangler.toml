name = "eng-diagnostic"
main = "worker/src/index.ts"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "edt-diagnostic"
database_id = "4c4685d5-4e7d-415f-8c50-61894219deb4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "edt-assets"

[vars]
ALLOWED_ORIGIN = "https://eng-diagnostic.tzy667.workers.dev"
SESSION_TTL_SECONDS = "7200"
# ADMIN_PASSWORD is a SECRET — never add it here. Set it once per environment with
#   npx wrangler secret put ADMIN_PASSWORD
# and keep the local value in worker/.dev.vars (gitignored). Admin routes return
# 503 when it is unset, so a missing secret fails closed instead of opening access.

[[queues.producers]]
binding = "PAPER3_GRADE"
queue = "edt-paper3-grade"

[[queues.consumers]]
queue = "edt-paper3-grade"
max_batch_size = 1
max_retries = 20
max_concurrency = 2
